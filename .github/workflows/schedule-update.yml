name: Daily Submodule Update

on:
  schedule:
    # 매일 자정(한국 시간 기준)에 실행 (UTC 기준 15:00)
    - cron: '0 15 * * *'
  workflow_dispatch: # ⭐️ 테스트를 위해 수동으로도 실행할 수 있게 버튼을 만듭니다.

jobs:
  update-submodules:
    runs-on: ubuntu-latest

    # GitHub Action이 레포지토리에 커밋하고 푸시할 수 있도록 쓰기 권한을 부여합니다.
    permissions:
      contents: write

    steps:
      - name: Checkout Parent Repository
        uses: actions/checkout@v4
        with:
          submodules: true # 서브모듈도 함께 체크아웃합니다.

      - name: Update Submodules
        run: |
          # 프론트엔드와 백엔드 모두 원격 저장소의 최신 버전으로 업데이트
          git submodule update --remote

      - name: Commit and Push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add .

          # 변경 사항이 있을 때만 커밋하여 에러를 방지합니다.
          git diff-index --quiet HEAD || git commit -m "chore: auto-update submodules to latest"
          git push origin main
